services:
  redis:
    image: redis:7-alpine
    container_name: streetconnect_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - streetconnect_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streetconnect_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8000
      REDIS_URL: redis://redis:6379
      # Supabase credentials
      SUPABASE_URL: https://jqgemewsbmwhckajxjkn.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxZ2VtZXdzYm13aGNrYWp4amtuIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MDE5OTk4NywiZXhwIjoyMDg1Nzc1OTg3fQ.1jHFPgqdMFdfvndRQCYjl-j283IbuooG4C5_xYIYATQ
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxZ2VtZXdzYm13aGNrYWp4amtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxOTk5ODcsImV4cCI6MjA4NTc3NTk4N30.9zUq4zCZfJCC00KkKy7bjn89-DL01YOyUNyM77A73X4
    ports:
      - "8000:8000"
    depends_on:
      redis:
