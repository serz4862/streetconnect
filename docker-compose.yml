services:
  postgres:
    image: postgres:15-alpine
    container_name: streetconnect_postgres
    restart: always
    environment:
      POSTGRES_USER: streetconnect
      POSTGRES_PASSWORD: streetconnect_secure_password
      POSTGRES_DB: streetconnect_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - streetconnect_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streetconnect_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - streetconnect_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streetconnect_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgres://streetconnect:streetconnect_secure_password@postgres:5432/streetconnect_db
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - streetconnect_network
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:

networks:
  streetconnect_network:
    driver: bridge
